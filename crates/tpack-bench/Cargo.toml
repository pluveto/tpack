[package]
name = "tpack-bench"
description = "Size and throughput benchmark harness for TPACK (not published)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tpack = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"
rmp-serde = "1.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
stats_alloc = "0.1"

[[bench]]
name = "codec_bench"
harness = false

[[example]]
name = "size_report"
path = "examples/size_report.rs"

[[example]]
name = "matrix_report"
path = "examples/matrix_report.rs"

[[example]]
name = "perf_smoke"
path = "examples/perf_smoke.rs"
